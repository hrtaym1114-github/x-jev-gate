[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-jev-gate"
version = "0.1.0"
description = "TypeSafe Jev (System One) gate CLI for X draft posts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hrtaym1114" }]
keywords = ["typesafe", "jev", "x", "twitter", "gate", "noul"]
dependencies = [
    "typesafe-sdk>=0.6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
x-jev-gate = "x_jev_gate.cli:main"

[project.urls]
Homepage = "https://github.com/hrtaym1114-github/x-jev-gate"
Related = "https://github.com/Bodila51/grok-bot-jev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x_jev_gate = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
